spring.application.name=fdiet
server.port=${SERVER_PORT:5000}

# --- Datasource (MySQL) -----------------------------------------------------
# Every value comes from an environment variable; see .env.example.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fdiet}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Flyway -----------------------------------------------------------------
# Migrations run automatically on startup; they are the only thing that
# creates or alters the schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA / Hibernate --------------------------------------------------------
# `validate`: Hibernate checks the entities against the Flyway schema and never
# touches DDL itself. Switch to `none` if you want to skip that check.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
# Loads a diet's dishes, ingredients and their food items in a few batched
# selects instead of one per row; open-in-view is off, so those lazy loads
# happen inside the service transaction.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Diet import ------------------------------------------------------------
# A hand-written diet workbook is a few tens of kilobytes; the limit is only
# there so a bad upload cannot be read into memory.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# How many resolved food names the diet import keeps in memory between runs,
# per half of the catalogue.
fdiet.diet.food-cache-size=5000
# How many candidates the fix-up listing offers for an unmatched ingredient.
fdiet.diet.suggestion-limit=5

# --- Open composition tables (CIQUAL 2025, BLS 4.0) -------------------------
# Snapshots, licences and fdiet's Spanish-name crosswalk; see
# reference-data/composition/README.md. Loaded on the first start against an
# empty table, and on POST /api/composition/sync.
fdiet.composition.data-path=${COMPOSITION_DATA_PATH:reference-data/composition}
fdiet.composition.sync-on-startup=true
# Rows per JDBC batch of the sync's upsert.
fdiet.composition.batch-size=500

# --- Nutrition reference data -----------------------------------------------
# Rations, household measures and recommendations, each row with its source;
# see reference-data/README.md. Loaded at startup (idempotent) and on
# POST /api/reference/sync.
fdiet.reference.data-path=${REFERENCE_DATA_PATH:reference-data}
fdiet.reference.sync-on-startup=true
# The profile an adult's diet, or one whose patient has no birth date, is
# suggested against.
fdiet.reference.default-adult-profile=AESAN-2022:ADULTOS

# --- Food import ------------------------------------------------------------
fdiet.food.csv-path=${FOOD_CSV_PATH:fooddata.csv}
fdiet.food.import-batch-size=500

# --- springdoc --------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
