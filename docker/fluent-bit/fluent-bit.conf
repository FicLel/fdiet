# Every container's stdout/stderr (docker's fluentd log driver) into OpenSearch,
# one index per day: fdiet-logs-YYYY.MM.DD. Browse them in OpenSearch Dashboards.

[SERVICE]
    Flush         2
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# The backend (Spring's ECS format) and the scrapper write one JSON object per line: lift
# its fields to the top of the record. Plain-text lines (MySQL, nginx) keep their `log`.
[FILTER]
    Name          parser
    Match         fdiet.*
    Key_Name      log
    Parser        json
    Reserve_Data  On

[OUTPUT]
    Name               opensearch
    Match              fdiet.*
    Host               opensearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    fdiet-logs
    # The backend's ECS lines carry their own @timestamp; Fluent Bit's goes beside it.
    Time_Key           ingested_at
    # ECS keys are dotted (log.level); dots would turn `log` into an object and clash
    # with the plain-text lines' `log` string.
    Replace_Dots       On
    Suppress_Type_Name On
    Trace_Error        On
    Retry_Limit        False
